title: IBM i System Alerts
description: Understand, build, and tailor IBM i system alerts delivered through data queues and webhooks.
remote_theme: just-the-docs/just-the-docs
color_scheme: light
# Set url and baseurl when the repository name and Pages address are final.
url: ""
baseurl: ""
search_enabled: true
search:
  heading_level: 3
  previews: 3
enable_copy_code_button: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: Back to top
aux_links:
  RPG Tutorial:
    - https://rpgtutorial.k3s.com
aux_links_new_tab: true
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Try it
    color: green
  warning:
    title: Before production
    color: yellow
footer_content: 'A community starter guide. MIT licensed. Inspired by the <a href="https://github.com/K3S/rpg-tutorial">K3S RPG Tutorial</a>.'
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - tests
  - .github
  - preview
  - site-preview.zip
  - starter.zip
